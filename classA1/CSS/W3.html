<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {
                text-align: center;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                height: 50vh;
                
            }
            .item {
                width: 300px;
                height: 200px;
                background-color:lightblue;
                margin: 5px;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-grow: 1;
            }
        </style>
        <title>W3 schools layout</title>
    </head>
    <body>
        <h1>This is my W3 schools layout practice</h1>
        <div class="container" >
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
            <div class="item">Item 5</div>
        </div>

    </body>
</html>
